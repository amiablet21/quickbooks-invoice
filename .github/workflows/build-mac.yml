name: Build macOS DMG

# A .dmg can only be produced on macOS, so this runs on a GitHub-hosted Mac.
# Each run uploads the DMG as a workflow artifact and publishes it on a
# GitHub Release (tag mac-v<version>) so it has a direct download link.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Build DMG
        run: npm run dist:mac
        env:
          # No Apple Developer certificate: build/adhoc-sign.cjs ad-hoc signs the app instead.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Invoice-Studio-mac
          path: release/*.dmg

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-v${{ steps.v.outputs.version }}
          name: Invoice Studio ${{ steps.v.outputs.version }} for Mac
          target_commitish: ${{ github.sha }}
          files: release/*.dmg
          fail_on_unmatched_files: true
          body: |
            Download **Invoice-Studio-${{ steps.v.outputs.version }}.dmg** below (works on Apple Silicon and Intel Macs).

            First launch: the app isn't notarized by Apple, so macOS will block it the first time.
            Open the DMG, drag Invoice Studio into Applications, then **right-click the app → Open → Open**.
            (On macOS 15+: try to open it once, then go to System Settings → Privacy & Security → **Open Anyway**.)
